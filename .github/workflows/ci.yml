name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  RUSTLER_PRECOMPILATION_EXAMPLE_BUILD: "1"

jobs:
  elixir:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.4"
            otp: "27.3"
          - elixir: "1.20.2"
            otp: "28.3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run tests and enforce coverage
        run: mix test --cover

      - name: Run Credo
        if: matrix.elixir == '1.20.2'
        run: mix credo --strict

      - name: Verify documentation
        if: matrix.elixir == '1.20.2'
        run: mix docs --warnings-as-errors

  rust:
    name: Rust
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --manifest-path native/fast_thumbnail/Cargo.toml --check

      - name: Run tests
        run: cargo test --manifest-path native/fast_thumbnail/Cargo.toml --locked

      - name: Run Clippy
        run: cargo clippy --manifest-path native/fast_thumbnail/Cargo.toml --locked -- -D warnings
