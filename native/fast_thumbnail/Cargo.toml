[package]
name = "fast_thumbnail"
version = "0.1.6"
authors = []
edition = "2021"

[lib]
name = "fast_thumbnail"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.38.0", default-features = false }
fast_image_resize = { version = "5.1.2", features = ["image"] }
image = "0.24.4"
base64 = "0.22.1"
webp = "0.3.0"
libwebp-sys = "0.9"

[features]
default = ["nif_version_2_15"]
nif_version_2_15 = ["rustler/nif_version_2_15"]
nif_version_2_16 = ["rustler/nif_version_2_16"]

[profile.release]
codegen-units = 1
lto = true
panic = 'abort'
strip = "debuginfo"
